[package]
name = "box-installer"
version = "0.1.0"
edition = "2021"
description = "The Box installer: disk probe, storage-layout wizard (TUI) and plan"
license = "Apache-2.0"

[[bin]]
name = "box-installer"
path = "src/main.rs"

[dependencies]
box-core = { path = "../box-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
