[workspace]
resolver = "2"
members = ["boxd", "crates/box-core", "crates/box-installer"]

# THE version of The Box: one literal for the whole platform. Every crate
# inherits it, flake.nix reads it (so the Nix packages and the platform release
# label baked into /etc/box/platform.json agree), and CI refuses to publish a
# tag that doesn't match it. Bump this when cutting a release.
[workspace.package]
version = "0.3.14"

# Shared release profile for the appliance binaries: small and quiet.
[profile.release]
opt-level = "s"
lto = "thin"
strip = true
