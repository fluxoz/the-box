[package]
name = "boxd"
version = "0.1.0"
edition = "2021"
description = "The Box daemon: declarative service management, local dashboard and agent API"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
axum = "0.8"
box-core = { path = "../crates/box-core" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
maud = "0.27"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
