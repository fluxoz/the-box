# Publish thebox.build on a version tag:
#   * heavy netboot artifacts  -> a GitHub Release (free, CDN-backed)
#   * install.sh + landing page -> GitHub Pages at thebox.build
# No org and no third-party host needed — everything is on this repo.
name: Publish thebox.build

on:
  push:
    # A tag cuts a Release. A push to main deploys the SITE, and only the site:
    # every Release/worker/pi/channel job below is individually tag-gated.
    #
    # Without this, site changes sat on main looking finished while
    # thebox.build served the previous release's page — the Configurator was
    # weeks stale and nothing said so, because "merged" and "live" were
    # different things and no signal connected them.
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch: {} # manual run: deploys Pages; skips the Release

permissions:
  contents: write # create the Release
  pages: write # deploy Pages
  id-token: write # Pages OIDC

# Per-ref, so two different releases never queue behind each other (v0.3.1 sat
# waiting for an hour while v0.3.0's Pi kernel compiled). Re-pushing the SAME
# ref still serializes, which is what the lock is actually for.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag and the platform's one version literal must agree, or a release
  # ships boxes that misreport what they run (which is exactly how every box
  # ended up displaying 0.1.0 / "dev"). Cheap, and it gates the whole publish.
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$version" ] || { echo "::error::could not read [workspace.package] version from Cargo.toml"; exit 1; }
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo workspace version ${version} (expected tag v${version}). Bump [workspace.package] version in Cargo.toml, or retag."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches version ${version}"

  build:
    needs: version-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # We use our own substituters; the default (determinate: true) also
          # logs in to FlakeHub, which fails every run with no token.
          determinate: false
          # Put the caches straight in nix.conf. Relying on the flake's declared
          # nixConfig doesn't work in non-interactive CI (Nix ignores flake-
          # provided substituters without accept-flake-config), which silently
          # falls back to cache.nixos.org and recompiles the Pi kernel from
          # source (~40 min). With these here, the kernel is a download.
          extra-conf: |
            extra-substituters = https://nixos-raspberrypi.cachix.org https://fluxoz.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= fluxoz.cachix.org-1:yzuO7pZpCoHEIT6PQiYJ1eupby/rH3Ls3Q18+VA0Krc=
      # Optional: add a binary cache here later to speed builds.

      # Don't ship a trimmed installer that can't reach its cache: if a real key
      # is set (trim active) but there's no token to push the closure, fail fast.
      - name: Guard — a real cache key needs CACHIX_AUTH_TOKEN
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          key=$(grep -A2 'boxCache = {' flake.nix | grep trustedPublicKeys || true)
          if ! echo "$key" | grep -q REPLACE_WITH_CACHIX_PUBLIC_KEY && [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::error::flake.nix has a real cache key (initrd trim active) but CACHIX_AUTH_TOKEN is unset — the trimmed installer would ship unable to fetch the Box OS closure. Add the secret (Settings → Secrets → Actions), then re-run."
            exit 1
          fi

      - name: Build the site bundle
        run: nix build .#site

      # Publish the Box OS closure so a trimmed installer (and channel updates)
      # can fetch it instead of embedding/compiling it. Skips cleanly until
      # CACHIX_AUTH_TOKEN is set — see docs/publish.md.
      - name: Publish Box OS closure to the cache
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "CACHIX_AUTH_TOKEN not set — skipping cache push (installer stays fat/embedded)."
            exit 0
          fi
          nix profile install nixpkgs#cachix
          cachix authtoken "$CACHIX_AUTH_TOKEN"
          sys=$(nix build .#nixosConfigurations.box-os.config.system.build.toplevel --no-link --print-out-paths)
          PIN_NAME=box-os PIN_KEEP=10 .github/scripts/push-closure.sh "$sys"

      - name: Stage the bundle + stamp the Release URL into install.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # On a tag this IS the release. On a push to main it is not: stamping
          # "main" here would point install.sh at a download URL that does not
          # exist, so resolve the newest published release instead. Getting this
          # wrong ships a site whose one-liner 404s.
          case "${GITHUB_REF}" in
            refs/tags/*) tag="${GITHUB_REF_NAME}" ;;
            *) tag=$(gh release view --json tagName -q .tagName) ;;
          esac
          [ -n "$tag" ] || { echo "::error::could not resolve a release tag to stamp"; exit 1; }
          echo "stamping netboot base with $tag"
          rel="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          mkdir -p pub
          cp -rL result/. pub/
          chmod -R u+w pub
          # netboot artifacts are served from the Release, not thebox.build
          sed -i "s|@NETBOOT_BASE@|${rel}|" pub/install.sh
          # refresh checksums over the final served files
          ( cd pub && find . -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS )

      - name: Publish the Release (heavy artifacts)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pub/netboot/bzImage
            pub/netboot/initrd
            pub/netboot/netboot.ipxe
            pub/install.sh
            pub/SHA256SUMS
          fail_on_unmatched_files: true

      - name: Assemble Pages content (everything but heavy netboot artifacts)
        run: |
          set -euo pipefail
          mkdir -p site_out
          # Serve the whole site (landing, docs, configurator, installers,
          # checksums) — everything except the heavy netboot images, which
          # come from the Release.
          cp -r pub/. site_out/
          rm -rf site_out/netboot
          echo 'thebox.build' > site_out/CNAME

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site_out
          # v4 started dropping dotfiles from the artifact. The site has none
          # today, but a future .well-known/ (domain verification, ACME) would
          # vanish silently — keep the pre-v4 behaviour.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # The Worker that personalizes image downloads: it streams the generic
  # artifact out of R2 and swaps the claim file as the bytes go past, so no
  # per-user image is ever built or stored. Deploying it is the last step of
  # switching the flash door on. Skipped whole when the secret is absent, so a
  # repo that has not switched it on still releases cleanly.
  deploy-worker:
    # Tags, plus manual dispatch so a Worker fix can reach QA without cutting
    # a release (same reasoning as x86-image).
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    # Never ship the Worker for a release that failed its own version guard.
    needs: [version-guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deploy the image Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — image downloads stay switched off."
            echo "See docs/claim-flow-spec.md for what turning them on takes."
            exit 0
          fi
          cd worker
          npx --yes wrangler@latest deploy

  # Advance the `release` branch — the platform update channel boxes track —
  # to this tag, but only after the site/closure (build) and the aarch64 boxd
  # (cache-aarch64) are published and cached. Boxes checking the channel then
  # see the new revision with its closure already downloadable, never a rev
  # they'd have to compile. This is why the channel is `release`, not `main`:
  # main moves on every push, cached or not.
  advance-channel:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, cache-aarch64]
    runs-on: ubuntu-latest
    steps:
      # Move the ref through the API rather than `git push`. A push is refused
      # outright when the new commit touches .github/workflows — "refusing to
      # allow a GitHub App to create or update workflow ... without `workflows`
      # permission" — and GITHUB_TOKEN cannot be granted that permission, so any
      # release that edits CI would silently fail to advance the channel (v0.3.3
      # did). Updating a ref only re-points it at a commit that already exists in
      # the repo, so it introduces no workflow content.
      - name: Fast-forward release to ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/release" \
            -f sha="${GITHUB_SHA}" -F force=true \
            --jq '"release -> " + .object.sha'

  # Publish aarch64 boxd so `nix build …#pi{3,4,5}-image` and Pi channel-updates
  # fetch it instead of compiling it (the vendor kernel already comes from
  # nixos-raspberrypi.cachix.org; everything else from cache.nixos.org). Runs in
  # parallel with build/deploy — an emulated aarch64 compile is slow, so it must
  # never delay the release, and a failure here is non-fatal.
  cache-aarch64:
    needs: version-guard
    # Native ARM runner (free for public repos) — builds aarch64 boxd in minutes,
    # not ~an hour under QEMU emulation.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # We use our own substituters; the default (determinate: true) also
          # logs in to FlakeHub, which fails every run with no token.
          determinate: false
          # Put the caches straight in nix.conf. Relying on the flake's declared
          # nixConfig doesn't work in non-interactive CI (Nix ignores flake-
          # provided substituters without accept-flake-config), which silently
          # falls back to cache.nixos.org and recompiles the Pi kernel from
          # source (~40 min). With these here, the kernel is a download.
          extra-conf: |
            extra-substituters = https://nixos-raspberrypi.cachix.org https://fluxoz.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= fluxoz.cachix.org-1:yzuO7pZpCoHEIT6PQiYJ1eupby/rH3Ls3Q18+VA0Krc=
      - name: Build + push aarch64 boxd to the cache
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "CACHIX_AUTH_TOKEN not set — skipping aarch64 cache push."
            exit 0
          fi
          nix profile install nixpkgs#cachix
          cachix authtoken "$CACHIX_AUTH_TOKEN"
          boxd=$(nix build .#packages.aarch64-linux.boxd --no-link --print-out-paths) || {
            echo "aarch64 boxd build failed under emulation — skipping (non-fatal)."; exit 0; }
          PIN_NAME=boxd-aarch64 PIN_KEEP=5 .github/scripts/push-closure.sh "$boxd"

  # Build ready-to-flash Raspberry Pi images and attach them to the Release, so a
  # user downloads a .img.xz and flashes it (Raspberry Pi Imager / dd) instead of
  # building one with Nix. Native ARM runner + the flake's declared caches keep
  # the vendor kernel a download, not an emulated compile. Parallel with build/
  # deploy so it never delays the Pages deploy.
  pi-images:
    needs: version-guard
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04-arm
    # One parallel job per model: the images are independent, so build them
    # concurrently rather than in a serial loop. Each uploads as soon as it's
    # done, so pi5 doesn't wait on pi3/pi4. fail-fast off so one model's failure
    # doesn't cancel the others.
    strategy:
      fail-fast: false
      matrix:
        model: ["3", "4", "5"]
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # We use our own substituters; the default (determinate: true) also
          # logs in to FlakeHub, which fails every run with no token.
          determinate: false
          # Put the caches straight in nix.conf. Relying on the flake's declared
          # nixConfig doesn't work in non-interactive CI (Nix ignores flake-
          # provided substituters without accept-flake-config), which silently
          # falls back to cache.nixos.org and recompiles the Pi kernel from
          # source (~40 min). With these here, the kernel is a download.
          extra-conf: |
            extra-substituters = https://nixos-raspberrypi.cachix.org https://fluxoz.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= fluxoz.cachix.org-1:yzuO7pZpCoHEIT6PQiYJ1eupby/rH3Ls3Q18+VA0Krc=
      - name: Build + compress the pi${{ matrix.model }} image
        id: build
        run: |
          set -euo pipefail
          out=$(nix build ".#packages.aarch64-linux.pi${{ matrix.model }}-image" --no-link --print-out-paths)
          echo "out=$out" >> "$GITHUB_OUTPUT"
          img=$(echo "$out"/sd-image/*.img)
          # .xz is the format Raspberry Pi Imager and `dd` users expect; the
          # image is mostly empty so it shrinks a lot.
          xz -T0 -6 -c "$img" > "thebox-pi${{ matrix.model }}.img.xz"
          sha256sum "thebox-pi${{ matrix.model }}.img.xz" > "thebox-pi${{ matrix.model }}.img.xz.sha256"
          ls -la thebox-pi${{ matrix.model }}.img.xz*

      # The same image, packed so a download can be personalized in flight: a
      # fixed-size claim file on the FAT boot partition, carried in its own
      # STORED deflate block. Reuses the image built above rather than building
      # anything. See docs/claim-flow-spec.md.
      - name: Pack the pi${{ matrix.model }} personalizable image
        run: |
          set -euo pipefail
          img=$(echo "${{ steps.build.outputs.out }}"/sd-image/*.img)
          name="thebox-pi${{ matrix.model }}"
          df -h . | tail -1
          # Pass the store path straight in. The packer copies it once itself
          # (it has to, because it writes the claim file into the FAT
          # partition), and an extra `cp` here would put a THIRD ~5.8 GB copy
          # on a runner that has about 14 GB free.
          nix shell nixpkgs#python3 nixpkgs#mtools nixpkgs#util-linux --command \
            python3 scripts/personalizable-image.py \
              "$img" "$name.img.gz" "$name.img.gz.manifest.json"
          # Hash the artifact we just produced, so the generic image stays
          # independently checkable even though downloads are personalized.
          sha256sum "$name.img.gz" > "$name.img.gz.sha256"
          ls -la "$name.img.gz"*

      # Publish to R2, where the Worker streams and patches it.
      #
      # Over the S3 API, not `wrangler r2 object put`: that does a single-part
      # PUT and refuses anything past a few hundred MB, and these images are
      # ~2 GB. NOT continue-on-error either — a silently skipped upload leaves
      # R2 holding the PREVIOUS release's image while the Release page shows the
      # new one, and every personalized download would then be of the old OS.
      # Absent credentials is the one case that is allowed to no-op.
      - name: Upload the pi${{ matrix.model }} image to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${ACCOUNT:-}" ]; then
            echo "R2 credentials not set — image downloads stay switched off."
            exit 0
          fi
          name="thebox-pi${{ matrix.model }}"
          ep="https://$ACCOUNT.r2.cloudflarestorage.com"
          nix shell nixpkgs#awscli2 --command aws s3 cp "$name.img.gz" \
            "s3://box-images/$name.img.gz" --endpoint-url "$ep" --only-show-errors
          nix shell nixpkgs#awscli2 --command aws s3 cp "$name.img.gz.manifest.json" \
            "s3://box-images/$name.img.gz.manifest.json" --endpoint-url "$ep" --only-show-errors
          # The manifest must describe the object that is actually there.
          nix shell nixpkgs#awscli2 --command aws s3api head-object \
            --bucket box-images --key "$name.img.gz" --endpoint-url "$ep" \
            --query ContentLength --output text

      # Push the system toplevel so a Pi running `boxd channel update` DOWNLOADS
      # this release instead of compiling Rust on a Raspberry Pi. (CI itself
      # gains nothing from it: the closure contains boxd, so its hash changes
      # every release and a later run can never substitute it.) We deliberately
      # do not push the sdImage closure — a 4.6 GiB leaf artifact that already
      # ships on the Release and that nothing will ever substitute.
      #
      # This step must NEVER cause a build. Realising the kernel's `dev` output
      # here, for instance, looks harmless but forces a full ~1h30m kernel
      # rebuild: `dev` is on no binary cache and, with ZFS off, nothing else
      # asks for it, so Nix would compile the whole multi-output derivation just
      # to produce it. Only ever push paths this job already produced.
      - name: Cache the pi${{ matrix.model }} closure (fluxoz)
        continue-on-error: true
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "CACHIX_AUTH_TOKEN not set — skipping pi${{ matrix.model }} cache push."
            exit 0
          fi
          nix profile install nixpkgs#cachix
          cachix authtoken "$CACHIX_AUTH_TOKEN"
          # eval, not build: resolve the path without realising anything.
          sys=$(nix eval --raw \
            ".#nixosConfigurations.box-os-pi${{ matrix.model }}.config.system.build.toplevel")
          PIN_NAME=box-os-pi${{ matrix.model }} PIN_KEEP=3 \

            .github/scripts/push-closure.sh "$sys" https://nixos-raspberrypi.cachix.org

      - name: Attach the pi${{ matrix.model }} image to the Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            thebox-pi${{ matrix.model }}.img.xz
            thebox-pi${{ matrix.model }}.img.xz.sha256
            thebox-pi${{ matrix.model }}.img.gz
            thebox-pi${{ matrix.model }}.img.gz.sha256
            thebox-pi${{ matrix.model }}.img.gz.manifest.json
          fail_on_unmatched_files: true

  # The flashable x86 image (thebox-x86): the same personalizable treatment as
  # the Pi images, for any x86-64 UEFI machine — PC, laptop, mini-PC, Intel
  # Mac. Runs on tags like the Pi images, and on workflow_dispatch so an image
  # fix can reach R2 (and QA) without cutting a release.
  x86-image:
    needs: version-guard
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://fluxoz.cachix.org
            extra-trusted-public-keys = fluxoz.cachix.org-1:yzuO7pZpCoHEIT6PQiYJ1eupby/rH3Ls3Q18+VA0Krc=
      - name: Build + compress the x86 image
        id: build
        run: |
          set -euo pipefail
          out=$(nix build .#installer-usb --no-link --print-out-paths)
          echo "out=$out" >> "$GITHUB_OUTPUT"
          # .xz for the plain, hash-checkable download; the image is mostly
          # empty FAT so it shrinks a lot.
          xz -T0 -6 -c "$out/thebox-x86.img" > thebox-x86.img.xz
          sha256sum thebox-x86.img.xz > thebox-x86.img.xz.sha256
          ls -la thebox-x86.img.xz*
      - name: Pack the personalizable x86 image
        run: |
          set -euo pipefail
          nix shell nixpkgs#python3 nixpkgs#mtools nixpkgs#util-linux --command \
            python3 scripts/personalizable-image.py \
              "${{ steps.build.outputs.out }}/thebox-x86.img" \
              thebox-x86.img.gz thebox-x86.img.gz.manifest.json
          sha256sum thebox-x86.img.gz > thebox-x86.img.gz.sha256
          ls -la thebox-x86.img.gz*
      # Publish to R2, where the Worker streams and patches it. Same rules as
      # the Pi images: S3 multipart (not wrangler), loud failure, and only
      # absent credentials may no-op.
      - name: Upload the x86 image to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${ACCOUNT:-}" ]; then
            echo "R2 credentials not set — image downloads stay switched off."
            exit 0
          fi
          name="thebox-x86"
          ep="https://$ACCOUNT.r2.cloudflarestorage.com"
          nix shell nixpkgs#awscli2 --command aws s3 cp "$name.img.gz" \
            "s3://box-images/$name.img.gz" --endpoint-url "$ep" --only-show-errors
          nix shell nixpkgs#awscli2 --command aws s3 cp "$name.img.gz.manifest.json" \
            "s3://box-images/$name.img.gz.manifest.json" --endpoint-url "$ep" --only-show-errors
          # The manifest must describe the object that is actually there.
          nix shell nixpkgs#awscli2 --command aws s3api head-object \
            --bucket box-images --key "$name.img.gz" --endpoint-url "$ep" \
            --query ContentLength --output text
      - name: Attach the x86 image to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            thebox-x86.img.xz
            thebox-x86.img.xz.sha256
            thebox-x86.img.gz
            thebox-x86.img.gz.sha256
            thebox-x86.img.gz.manifest.json
          fail_on_unmatched_files: true
