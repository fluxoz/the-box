# Temporary: stand up the cloud.thebox.build tunnel + DNS with the CI token.
# The tunnel run-credential leaves ONLY age-encrypted to the dispatcher's
# recipient key (this is a public repo; logs are public). Delete this workflow
# after the go-live.
name: cf-probe
on:
  workflow_dispatch:
    inputs:
      recipient:
        description: age recipient for the encrypted tunnel token
        required: true
jobs:
  golive:
    runs-on: ubuntu-latest
    steps:
      - name: Tunnel + DNS for cloud.thebox.build
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq age >/dev/null
          api() { curl -fsS -H "Authorization: Bearer $T" -H "Content-Type: application/json" "$@"; }
          B=https://api.cloudflare.com/client/v4

          ZONES=$(api "$B/zones?name=thebox.build")
          ZONE=$(echo "$ZONES"  | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"][0]["id"])')
          ACCT=$(echo "$ZONES"  | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"][0]["account"]["id"])')
          echo "zone ok, account ok"

          # Tunnel: find-or-create, remotely managed.
          EXISTING=$(api "$B/accounts/$ACCT/cfd_tunnel?name=box-cloud&is_deleted=false" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin)["result"] or []; print(r[0]["id"] if r else "")')
          if [ -z "$EXISTING" ]; then
            TUN=$(api -X POST "$B/accounts/$ACCT/cfd_tunnel" --data '{"name":"box-cloud","config_src":"cloudflare"}')
            TID=$(echo "$TUN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["id"])')
            echo "tunnel created"
          else
            TID="$EXISTING"; echo "tunnel exists"
          fi
          TOKEN=$(api "$B/accounts/$ACCT/cfd_tunnel/$TID/token" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"])')

          # Ingress: cloud.thebox.build -> the box-cloud service on the host.
          api -X PUT "$B/accounts/$ACCT/cfd_tunnel/$TID/configurations" --data '{
            "config": { "ingress": [
              { "hostname": "cloud.thebox.build", "service": "http://localhost:8788" },
              { "service": "http_status:404" } ] } }' >/dev/null
          echo "ingress set"

          # DNS: proxied CNAME to the tunnel.
          HAVE=$(api "$B/zones/$ZONE/dns_records?name=cloud.thebox.build" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin)["result"] or []; print(r[0]["id"] if r else "")')
          BODY="{\"type\":\"CNAME\",\"name\":\"cloud\",\"content\":\"$TID.cfargotunnel.com\",\"proxied\":true}"
          if [ -z "$HAVE" ]; then
            api -X POST "$B/zones/$ZONE/dns_records" --data "$BODY" >/dev/null && echo "dns created"
          else
            api -X PUT "$B/zones/$ZONE/dns_records/$HAVE" --data "$BODY" >/dev/null && echo "dns updated"
          fi

          echo "----- encrypted tunnel credential -----"
          printf '%s' "$TOKEN" | age -r "$RECIPIENT" -a
          echo "----- end -----"
