# Nightly: ask each maker's own store what our machines cost right now, and
# publish the result where the store page reads it (the `pricing` branch, the
# same pattern as the landing page's commissioning receipts). The store's
# totals are therefore checked against reality every night instead of rotting
# in static HTML — which they did: the first run of this check found one
# machine $800 cheaper than the page claimed.
#
# Price moves beyond taste get a human: drift FAILS this run, which GitHub
# emails to the owner — never a repo issue (standing rule: GitHub issues are
# not part of any product or ops flow). The fix is human because the Stripe
# deposit links can only be re-minted by a person holding the key
# (scripts/store-stripe-setup.sh).
name: Nightly store prices

on:
  schedule:
    - cron: "40 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # commit the checked prices to main
  actions: write # dispatch the site publish afterwards

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the makers' prices
        run: python3 scripts/store-prices.py --out /tmp/pricing.json

      - name: Commit the checked prices to main
        # No side branch: everything consolidates on main; the dispatched
        # publish serves the fresh numbers same-origin at /pricing/latest.json.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "the-box-nightly"
          git config user.email "nightly@thebox.build"
          git fetch origin main
          git checkout -B nightly-prices origin/main
          cp /tmp/pricing.json site/pricing/latest.json
          git add site/pricing/latest.json
          git commit -m "prices: $(date -u +%Y-%m-%dT%H:%MZ)"
          # main can move meanwhile; rebase and retry rather than fail.
          pushed=""
          for _ in 1 2 3; do
            if git push origin nightly-prices:main; then pushed=1; break; fi
            git fetch origin main && git rebase origin/main
          done
          [ -n "$pushed" ] || git push origin nightly-prices:main
          # A GITHUB_TOKEN push triggers no workflows (recursion guard), so the
          # site would never redeploy with the fresh data; dispatch the publish
          # explicitly instead.
          gh workflow run publish.yml --ref main

      - name: Surface drift to a human
        run: |
          set -euo pipefail
          drift=$(python3 -c "import json; print('\n'.join(json.load(open('/tmp/pricing.json'))['drift']))")
          [ -n "$drift" ] || { echo "no drift"; exit 0; }
          echo "::error title=Store prices drifted::the store's totals or deposits no longer match reality"
          echo "$drift"
          echo
          echo "Update baked_hardware / deposit_cents in scripts/store-catalog.json, re-run"
          echo "scripts/store-stripe-setup.sh if a deposit changed (it prints the new"
          echo "payment-link URLs), and update the static numbers in site/store/index.html."
          # A red run is the alert: GitHub emails the owner on scheduled-workflow
          # failure. The pricing branch was already pushed above, so the live
          # page still shows the checked numbers while the deposit catches up.
          exit 1
