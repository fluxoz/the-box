# One-shot: take down the public image Worker. Dispatch, then disable.
name: Teardown Cloudflare image Worker

on:
  workflow_dispatch: {}

jobs:
  delete-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Delete thebox-images Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID missing — cannot delete the Worker"
            exit 1
          fi
          cd worker
          npx --yes wrangler@latest delete --force --name thebox-images
