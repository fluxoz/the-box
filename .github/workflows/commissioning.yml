# Nightly commissioning: a blank VM takes the LIVE thebox.build one-liner and
# becomes a serving Box, timed stage by stage. The receipt it emits is
# committed to main (site/receipts/latest.json), which redeploys the site, so
# "last verified <tonight>" on thebox.build is a fact, not copy. A red run
# here means the funnel is broken for real people, which is exactly what a
# nightly should catch.
name: Nightly commissioning

on:
  schedule:
    - cron: "14 9 * * *" # nightly, offset from busy on-the-hour load
  workflow_dispatch: {}

permissions:
  contents: write # commit the receipt to main
  actions: write # dispatch the site publish afterwards

concurrency:
  group: commissioning
  cancel-in-progress: false

jobs:
  commission:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Install the theater (qemu + UEFI + cloud-init tooling)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf genisoimage
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rehearse commissioning against the live site
        run: |
          mkdir -p /tmp/commissioning
          OUT=/tmp/commissioning bash scripts/rehearse-commissioning.sh
          cat /tmp/commissioning/receipt.json
      - name: Keep the post-mortem (only written when a stage failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postmortem
          path: /tmp/commissioning/postmortem.log
          if-no-files-found: ignore
      - name: Publish the receipt
        if: always()
        # Committed to main, no side branch; the dispatched publish serves the
        # receipt same-origin at /receipts/latest.json for the landing page's
        # "last verified" line.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f /tmp/commissioning/receipt.json ] || exit 0
          set -euo pipefail
          git config user.name "the-box-nightly"
          git config user.email "nightly@thebox.build"
          git fetch origin main
          git checkout -B nightly-receipt origin/main
          cp /tmp/commissioning/receipt.json site/receipts/latest.json
          git add site/receipts/latest.json
          git commit -m "receipt: $(date -u +%Y-%m-%dT%H:%MZ)"
          # main can move meanwhile; rebase and retry rather than fail.
          pushed=""
          for _ in 1 2 3; do
            if git push origin nightly-receipt:main; then pushed=1; break; fi
            git fetch origin main && git rebase origin/main
          done
          [ -n "$pushed" ] || git push origin nightly-receipt:main
          # A GITHUB_TOKEN push triggers no workflows (recursion guard), so the
          # site would never redeploy with the fresh data; dispatch the publish
          # explicitly instead.
          gh workflow run publish.yml --ref main
