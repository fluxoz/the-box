id = "pgvector"
title = "PostgreSQL with pgvector"
description = "PostgreSQL with the pgvector extension, so your apps can store and search embeddings next to their ordinary tables. Normal Postgres tools and drivers work unchanged. Nothing outside your Box can reach it."
category = "Databases"
base = "container"
icon = "spark"

[params]
image = "docker.io/pgvector/pgvector:pg17"
container_port = 5432
expose = "internal"
volumes = ["/var/lib/box/pgvector:/var/lib/postgresql/data"]

[params.env]
# Internal-only (loopback), so trust auth is safe out of the box; override with
# POSTGRES_PASSWORD to require one.
POSTGRES_HOST_AUTH_METHOD = "trust"
