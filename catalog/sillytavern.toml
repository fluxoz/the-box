id = "sillytavern"
title = "SillyTavern chat frontend"
description = "A heavily customizable chat frontend for character and roleplay conversations, built for local backends like Ollama and llama.cpp as well as cloud APIs. Pick a model backend in its API connections panel after deploy. It is protected with a username and password the Box generates for you (user 'box'; the password is on the service page)."
category = "AI"
base = "container"
icon = "chat"

[params]
image = "ghcr.io/sillytavern/sillytavern:latest"
container_port = 8000
expose = "proxied"
volumes = [
  "/var/lib/box/sillytavern-config:/home/node/app/config",
  "/var/lib/box/sillytavern-data:/home/node/app/data",
]

[params.env]
# SillyTavern refuses to start when it can be reached from anywhere with no
# protection at all, which is the right instinct. Basic auth satisfies it,
# and the Box generates the password.
SILLYTAVERN_LISTEN = "true"
SILLYTAVERN_WHITELISTMODE = "false"
SILLYTAVERN_BASICAUTHMODE = "true"
SILLYTAVERN_BASICAUTHUSER_USERNAME = "box"

[params.secret_env]
SILLYTAVERN_BASICAUTHUSER_PASSWORD = "change-me-please"
