id = "olivetin"
title = "OliveTin action buttons"
description = "Big friendly buttons that run commands you define in config.yaml under /var/lib/box/olivetin, handy for giving the household one click actions. Commands run inside OliveTin's own container rather than on the Box host, so point them at network things like webhooks and HTTP APIs. It starts with no actions until you write that file."
category = "Automation"
base = "container"
icon = "spark"

[params]
image = "docker.io/jamesread/olivetin:latest"
container_port = 1337
expose = "proxied"
volumes = ["/var/lib/box/olivetin:/config"]
