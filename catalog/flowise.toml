id = "flowise"
title = "Flowise agent builder"
description = "Build chatbots and agent flows by wiring nodes together in the browser, then serve them as APIs or embeddable chat widgets. It keeps everything in its own bundled database and asks you to create an admin account on first visit. Works well with an Ollama service on this Box as the model backend."
category = "AI"
base = "container"
icon = "flow"

[params]
image = "docker.io/flowiseai/flowise:latest"
container_port = 3000
expose = "proxied"
volumes = ["/var/lib/box/flowise:/root/.flowise"]
