id = "postgres"
title = "PostgreSQL"
description = "A database for your other apps to use. Nothing outside your Box can reach it."
category = "Databases"
base = "container"
icon = "elephant"

[params]
image = "postgres:16"
container_port = 5432
expose = "internal"
volumes = ["/var/lib/box/postgres:/var/lib/postgresql/data"]

[params.env]
# Internal-only (loopback), so trust auth is safe out of the box; override with
# POSTGRES_PASSWORD to require one.
POSTGRES_HOST_AUTH_METHOD = "trust"
