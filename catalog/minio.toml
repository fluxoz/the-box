id = "minio"
title = "MinIO object storage"
description = "Your own file storage, like a private S3. Login details are created for you."
category = "Storage"
base = "container"
icon = "bucket"

[params]
image = "minio/minio"
container_port = 9000
expose = "proxied"
volumes = ["/var/lib/box/minio:/data"]
cmd = ["server", "/data", "--console-address", ":9001"]

# Credentials go through the encrypted secret env (age), never plaintext config.
# Override these at deploy; the values you set are what get encrypted.
[params.secret_env]
MINIO_ROOT_USER = "boxadmin"
MINIO_ROOT_PASSWORD = "change-me-please"
