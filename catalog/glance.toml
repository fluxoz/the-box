id = "glance"
title = "Glance dashboard"
description = "A fast home dashboard that pulls RSS feeds, weather, calendars, server stats and your own bookmarks into one page. Configured by a single YAML file in its volume, so it starts with a sensible default page and you edit from there."
category = "Home"
base = "container"
icon = "chart"

[params]
image = "docker.io/glanceapp/glance:v0.8"
container_port = 8080
expose = "proxied"
volumes = ["/var/lib/box/glance:/app/config"]
