id = "homebox"
title = "HomeBox home inventory"
description = "An inventory for the things you own: where they are, what they cost, serial numbers, warranties, and manuals. Create your account on the first visit. Small and quick, with its database kept on the Box."
category = "Home"
base = "container"
icon = "bucket"

[params]
image = "ghcr.io/sysadminsmedia/homebox:latest"
container_port = 7745
expose = "proxied"
volumes = ["/var/lib/box/homebox:/data"]

[params.secret_env]
# Homebox refuses to start without a pepper of at least 32 bytes. The Box
# generates a real one; rotating it invalidates issued API keys.
HBOX_AUTH_API_KEY_PEPPER = "change-me-to-at-least-32-characters-long"
