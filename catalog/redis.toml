id = "redis"
title = "Redis"
description = "Fast temporary storage that makes other apps quicker. Nothing outside your Box can reach it."
category = "Databases"
base = "container"
icon = "brick"

[params]
image = "redis:7"
container_port = 6379
expose = "internal"
volumes = ["/var/lib/box/redis:/data"]
cmd = ["redis-server", "--appendonly", "yes"]
